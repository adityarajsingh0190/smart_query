  background sync, optimistic updates, and pagination. Inspired by TanStack Query.
version: 1.0.0
homepage: https://github.com/AdiSingh-dev/smart_query
repository: https://github.com/AdiSingh-dev/smart_query
issue_tracker: https://github.com/AdiSingh-dev/smart_query/issues

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  collection: ^1.18.0
  meta: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  fake_async: ^1.3.1
  mocktail: ^1.0.0
